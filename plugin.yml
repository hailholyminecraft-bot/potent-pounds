name: PotendPound
version: ${version}
main: net.potendpound.PotendPoundPlugin
api-version: '26.2'
description: The Potend Pound - an axe/mace hybrid with armor-rending and a wind barrier.
commands:
  potendpound:
    description: Give the Potend Pound or reload the config
    usage: /potendpound <give [player]|reload>
    aliases: [pp]
    permission: potendpound.give
permissions:
  potendpound.give:
    description: Use /potendpound
    default: op
  potendpound.use:
    description: Use the Potend Pound's abilities
    default: true
