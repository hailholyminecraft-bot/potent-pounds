name: PotendPound
version: ${version}
main: net.potendpound.PotendPoundPlugin
api-version: '26.2'
description: The Potent Pound - an axe/mace hybrid with armor-rending, a wind barrier and a ruined trial-chamber altar.
commands:
  potendpound:
    description: Give the Potent Pound, reload, or build the ruined trial chamber
    usage: /potendpound <give [player]|reload|chamber|undo>
    aliases: [pp]
    permission: potendpound.give
permissions:
  potendpound.give:
    description: Use /potendpound
    default: op
  potendpound.chamber:
    description: Build / undo the ruined trial chamber
    default: op
  potendpound.use:
    description: Use the Potent Pound's abilities
    default: true
