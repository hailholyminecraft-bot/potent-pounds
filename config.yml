# ---------------------------------------------------------------
#  Potend Pound
#  Text uses MiniMessage: https://docs.advntr.dev/minimessage/
# ---------------------------------------------------------------

resource-pack:
  # Optional: host PotendPound-ResourcePack.zip somewhere and the plugin sends it on join.
  # Leave url empty if you load the pack another way (server.properties, client, etc.).
  url: ""
  sha1: ""

item:
  # <font:potendpound:potend> is the custom rune font from the resource pack.
  # Without the pack it falls back to the normal font, so the name still reads fine.
  name: "<!italic><font:potendpound:potend><gradient:#ffffff:#a3a3ad:#3d3d46>Potend Pound</gradient></font>"
  use-custom-model: true       # needs the resource pack (item model potendpound:potend_pound)
  disable-shields: true        # axe behaviour: a hit disables shields
  durability: 2031
  attack-damage: 9.0           # +1 base = 10 (netherite-axe level); Sharpness VII adds on top
  attack-speed: -3.0           # = 1.0 attacks/sec (axe-like)
  lore:
    - "<gradient:#f2f2f8:#6f6f7a>✦ Legendary Axe-Mace ✦</gradient>"
    - "<dark_gray><st>                                    </st>"
    - "<gray><i>Forged in the hush before a thunderclap,</i>"
    - "<gray><i>it does not swing — it <white>falls</white>.</i>"
    - ""
    - "<dark_gray>▸ <gradient:#ffffff:#8a8a95><b>REND ARMOR</b></gradient> <dark_gray>(<gray>Right Click<dark_gray>)"
    - "<gray>  Aim at a foe up to <white>{range} blocks</white> away. Their"
    - "<gray>  armor drops <white>one tier</white> — trims & enchants"
    - "<gray>  stay — then <white>reforges</white> after <white>{duration}s</white>."
    - ""
    - "<dark_gray>▸ <gradient:#ffffff:#8a8a95><b>FORTRESS OF WIND</b></gradient> <dark_gray>(<gray>Sneak + Right Click<dark_gray>)"
    - "<gray>  Erupt a <white>barrier box</white> around you that hurls"
    - "<gray>  every entity away and holds them at bay."
    - ""
    - "<dark_gray>▸ <gradient:#ffffff:#8a8a95><b>TITAN'S SLAM</b></gradient> <dark_gray>(<gray>Fall + Strike<dark_gray>)"
    - "<gray>  Crash down like a mace. Hungry for <white>Density</white>"
    - "<gray>  and <white>Wind Burst</white>."
    - "<dark_gray><st>                                    </st>"
    - "<dark_gray>“<gray>Let the sky remember its weight.<dark_gray>”"

downgrade:
  range: 20.0
  duration-seconds: 10
  cooldown-seconds: 12.0
  # Highest tier first. Each hit moves a piece one step down this list.
  tiers: [NETHERITE, DIAMOND, IRON, CHAINMAIL, GOLDEN, LEATHER]

barrier:
  half-size: 3.5               # box is (2*half-size) blocks wide/tall
  duration-seconds: 6
  cooldown-seconds: 25.0
  burst-strength: 1.8          # initial shockwave
  hold-strength: 0.7           # push while the box is up

nametag:
  enabled: true
  holding-only: false          # false = any Potend Pound in inventory, true = must be in a hand
  name-color: BLACK            # colour of the name itself (try DARK_GRAY if black is hard to read)
  prefix: "<gray>✦ "           # shown in grey around the black name
  suffix: " <gray>✦"
