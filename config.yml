# ---------------------------------------------------------------
#  Potent Pound
#  Text uses MiniMessage: https://docs.advntr.dev/minimessage/
# ---------------------------------------------------------------

resource-pack:
  # Optional: host PotendPound-ResourcePack.zip somewhere and the plugin sends it on join.
  url: ""
  sha1: ""

item:
  # <font:potendpound:potend> is the custom font from the resource pack (falls back to the normal font without it).
  name: "<!italic><font:potendpound:potend><gradient:#ffffff:#a3a3ad:#3d3d46>Potent Pound</gradient></font>"
  use-custom-model: true
  disable-shields: true
  durability: 2031
  attack-damage: 9.0           # +1 base = 10
  attack-speed: -2.4           # = 1.6 attacks/sec, the same cooldown as a sword
  lore:
    - "<gradient:#f2f2f8:#6f6f7a>✦ Legendary Axe-Mace ✦</gradient>"
    - "<dark_gray><st>                                    </st>"
    - "<gray><i>Forged in the hush before a thunderclap,</i>"
    - "<gray><i>it does not swing — it <white>falls</white>.</i>"
    - ""
    - "<dark_gray>▸ <gradient:#ffffff:#8a8a95><b>REND ARMOR</b></gradient> <dark_gray>(<gray>Right Click<dark_gray>)"
    - "<gray>  Aim at a foe up to <white>{range} blocks</white> away. Their"
    - "<gray>  armor drops <white>one tier</white> — trims & enchants"
    - "<gray>  stay — then <white>reforges</white> after <white>{duration}s</white>."
    - ""
    - "<dark_gray>▸ <gradient:#ffffff:#8a8a95><b>FORTRESS OF WIND</b></gradient> <dark_gray>(<gray>Sneak + Right Click<dark_gray>)"
    - "<gray>  Erupt a <white>barrier box</white> around you that hurls"
    - "<gray>  every entity away and holds them at bay."
    - ""
    - "<dark_gray>▸ <gradient:#ffffff:#8a8a95><b>TITAN'S SLAM</b></gradient> <dark_gray>(<gray>Fall + Strike<dark_gray>)"
    - "<gray>  Crash down like a mace. Every <white>kill</white> grows its"
    - "<gray>  <white>Density</white> by one, up to level <white>{density}</white>."
    - "<dark_gray><st>                                    </st>"
    - "<dark_gray>“<gray>Let the sky remember its weight.<dark_gray>”"

downgrade:
  range: 20.0
  duration-seconds: 10
  cooldown-seconds: 50.0
  tiers: [NETHERITE, DIAMOND, IRON, CHAINMAIL, GOLDEN, LEATHER]

barrier:
  half-size: 3.5
  duration-seconds: 6
  cooldown-seconds: 30.0
  burst-strength: 1.8
  hold-strength: 0.7

density:
  max: 6                       # the weapon starts with no Density and gains +1 per kill up to this
  count-mobs: false            # false = only player kills count, true = any kill counts

locator-bar:
  # Players only see the locator bar while a Dragon Egg is in their inventory.
  # (Uses the waypoint_receive_range attribute; the locatorBar game rule must stay on.)
  enabled: true

nametag:
  enabled: true
  holding-only: false
  name-color: DARK_GRAY        # dark grey name...
  prefix: "<gray>✦ "           # ...with grey ✦ around it
  suffix: " <gray>✦"

altar:
  knockback: true              # harmless push when the altar explodes (no damage is ever dealt)
